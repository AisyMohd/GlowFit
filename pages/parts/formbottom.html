
  <form id="outfit-form" class="mt-4 mb-4"> <!-- ID added here -->

    <!-- Event Type -->
    <div class="mb-6">
      <label for="event-type" id="event-type-label"
        class="block text-lg font-semibold mt-2 mb-1 text-slate-800">
        Event Type<span class="text-red-500">*</span>
      </label>

      <select id="event-type" class="w-full focus:outline-none px-4 py-2 rounded-md border border-gray-300 shadow-sm focus:shadow-md focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition">
        <option value="">Select an event...</option>
        <option value="smart casual">Smart Casual</option>
        <option value="meeting">Meeting</option>
        <option value="party">Party</option>
        <option value="sports day">Sports Day</option>
        <option value="wedding">Wedding</option>
      </select>
    </div>

    <!-- Gender -->
    <div class="mb-4">
      <label for="gender" id="gender-label"
        class="block text-lg font-semibold  mb-1 text-slate-800">
        Gender <span class="text-red-500">*</span>
      </label>

      <select id="gender" class="w-full focus:outline-none px-4 py-2 rounded-md border border-gray-300 shadow-sm focus:shadow-md focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition">
        <option value="">Select gender...</option>
        <option value="girl">Girl</option>
        <option value="boy">Boy</option>
      </select>
    </div>

    <!-- Weather -->
    <div class="mb-4">
      <label for="weather" id="weather-label"
        class="block text-lg font-semibold mt-2 mb-1 text-slate-800">
        Weather <span class="text-red-500">*</span>
      </label>

      <select id="weather" class="w-full focus:outline-none px-4 py-2 rounded-md border border-gray-300 shadow-sm focus:shadow-md focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition">
        <option value="">Select weather...</option>
        <option value="Sunny">Sunny</option>
        <option value="Hot">Hot</option>
        <option value="Rainy">Rainy</option>
      </select>
    </div>
    <!-- Event Theme -->
    <div class="mb-4">
      <label for="event-theme" id="event-theme-label"
        class="block text-lg font-semibold mt-2 mb-1 text-slate-800">
        Event Theme
      </label>

      <select id="event-theme" class="w-full focus:outline-none px-4 py-2 rounded-md border border-gray-300 shadow-sm focus:shadow-md focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition">
        <option value="">Select theme...</option>
        <option value="cute">Cute</option>
        <option value="formal">Formal</option>
        <option value="sporty">Sporty</option>
        <option value="elegant">Elegant</option>
      </select>
    </div>

    <!-- Location -->
    <div class="mb-4">
      <label for="location" id="location-label"
        class="block text-lg font-semibold mt-2 mb-1 text-slate-800">
        Location
      </label>

      <select id="location" class="w-full focus:outline-none px-4 py-2 rounded-md border border-gray-300 shadow-sm focus:shadow-md focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition">
        <option value="">Select location...</option>
        <option value="indoor">Indoor</option>
        <option value="outdoor">Outdoor</option>
      </select>
    </div>


    <!-- Top -->
    <div class="mb-8">
      <label class="block text-lg font-semibold mt-2 mb-1 text-slate-800">
        Your Top <span class="text-red-500">*</span>
      </label>
      <select
          id="user-top"
          class="w-full focus:outline-none px-4 py-2 rounded-md border border-gray-300 shadow-sm focus:shadow-md focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition"
        required>
        <option value="">Select top...</option>
        <option value="T-Shirt">T-Shirt</option>
        <option value="Blouse">Blouse</option>
        <option value="Sleeveless Top">Sleeveless Top</option>
        <option value="Crop Top">Crop Top</option>
        <option value="Knit Top">Knit Top</option>
        <option value="Sweater">Sweater</option>
        <option value="Jersey">Jersey</option>
        <option value="Dress Shirt">Dress Shirt</option>
        <option value="Collar Shirt">Collar Shirt</option>

      </select>
</div>

    <button type="submit" id="submit-btn"
      class="submit-btn w-full py-4 rounded-xl font-bold text-xl shadow-lg bg-indigo-600 text-white">
      Get Bottoms Recommendations
    </button>
  </form>
