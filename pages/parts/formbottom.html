<div class="rounded-3xl p-8 shadow-2xl mb-8 bg-white">
  <form id="bottom-form">

    <!-- Event Type -->
    <div class="mb-6">
      <label for="event-type" id="event-type-label"
        class="block text-lg font-semibold mb-3 text-slate-800">
        Event Type
      </label>

      <select id="event-type" >
        <option value="">Select an event...</option>
        <option value="going to class">Going to Class</option>
        <option value="presentation">Presentation</option>
        <option value="meeting">Meeting</option>
        <option value="party">Party</option>
        <option value="casual outing">Casual Outing</option>
        <option value="sports day">Sports Day</option>
        <option value="wedding">Wedding</option>
        <option value="date">Date</option>
      </select>
    </div>

    <!-- Event Theme -->
    <div class="mb-6">
      <label for="event-theme" id="event-theme-label"
        class="block text-lg font-semibold mb-3 text-slate-800">
        Event Theme
      </label>

      <select id="event-theme" >
        <option value="">Select theme...</option>
        <option value="cute">Cute</option>
        <option value="formal">Formal</option>
        <option value="sporty">Sporty</option>
        <option value="academic">Academic</option>
        <option value="elegant">Elegant</option>
        <option value="casual">Casual</option>
      </select>
    </div>

    <!-- Weather -->
    <div class="mb-6">
      <label for="weather" id="weather-label"
        class="block text-lg font-semibold mb-3 text-slate-800">
        Weather
      </label>

      <select id="weather" >
        <option value="">Select weather...</option>
        <option value="Sunny">Sunny</option>
        <option value="Hot">Hot</option>
        <option value="Cloudy">Cloudy</option>
        <option value="Rainy">Rainy</option>
        <option value="Windy">Windy</option>
      </select>
    </div>

    <!-- Location -->
    <div class="mb-8">
      <label for="location" id="location-label"
        class="block text-lg font-semibold mb-3 text-slate-800">
        Location
      </label>

      <select id="location" >
        <option value="">Select location...</option>
        <option value="indoor">Indoor</option>
        <option value="outdoor">Outdoor</option>
        <option value="classroom">Classroom</option>
        <option value="office">Office</option>
        <option value="hall">Hall</option>
        <option value="park">Park</option>
      </select>
    </div>

    <!-- Gender -->
    <div class="mb-8">
      <label for="gender" id="gender-label"
        class="block text-lg font-semibold mb-3 text-slate-800">
        Gender
      </label>

      <select id="gender">
        <option value="">Select gender...</option>
        <option value="girl">Girl</option>
        <option value="boy">Boy</option>
      </select>
    </div>
    <div>
          <label class="block mb-2 font-semibold text-gray-700">Your Top</label>
          <select id="user-bottom" class="w-full border rounded-xl p-3 focus:ring-2 focus:ring-purple-400">
            <option value="">Select top...</option>
            <option value="Blouse">Blouse</option>
            <option value="Shirt">Shirt</option>
          </select>
        </div>

    <button
      type="submit"
      id="submit-btn"
      class="submit-btn w-full py-4 rounded-xl font-bold text-xl shadow-lg bg-indigo-600 text-white">
      Get Color Recommendations
    </button>

  </form>
</div>
