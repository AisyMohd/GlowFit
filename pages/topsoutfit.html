<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GLOWFIT</title>
<link rel="icon" type="image/png" href="/images/logo glowfit.png">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&family=Outfit:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/sidebar.css">
  <style>
    :root {
      --tamarillo: #9e1814;
    --burnt-umber: #834625;
    --guardsman-red: #c4020a;
    --oil: #251d15;
    --copper: #be6e3f;
    --bulgarian-rose: #4d0c08;
    --cement: #907a65;
    --shingle-fawn: #765036;
    --tan: #d1b386;
    --soft-amber: #d1c5b1;
    --muddy-waters: #b9885c;

    --text-dark: #251d15; /* primary dark text */
    --text-secondary: #907a65; /* secondary text */
    }
    /* ===============================
       TYPOGRAPHY STYLES
       =============================== */
      .font-main-title { font-family: 'Playfair Display', serif; font-weight: 700; letter-spacing: 0.03em; color: var(--text-dark); }
      .font-tagline { font-family: 'Poppins', sans-serif; font-weight: 500; letter-spacing: 0.02em; color: var(--text-dark); }
      .font-card-title { font-family: 'Playfair Display', serif; font-weight: 700; color: var(--text-dark); }
      .font-card-desc { font-family: 'Outfit', sans-serif; font-weight: 300; color: var(--text-secondary); }

    /* ===============================
       GLOBAL PAGE STYLING
       =============================== */
    body {
      font-family: 'Outfit', sans-serif;
      margin: 0;
      overflow-x: hidden;
      background: linear-gradient(
        135deg,
        var(--bulgarian-rose) 0%,
        var(--tamarillo) 50%,
        var(--copper) 100%
      );
    }

    /* Subtle homepage radial pattern */
    .bg-pattern {
      background-image:
        radial-gradient(circle at 20% 80%, rgba(210,179,134,0.05), transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(190,110,63,0.05), transparent 50%),
        radial-gradient(circle at 40% 40%, rgba(157,24,20,0.03), transparent 50%);
    }

    /* ===============================
       BACKGROUND STAR / SPRINKLE EFFECT
       =============================== */
    #sprinkle-rain {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      overflow: hidden;
    }

    .star {
      position: absolute;
      animation: twinkle 1.5s infinite alternate;
      filter: drop-shadow(0 0 3px rgba(255,255,255,.7));
    }

    @keyframes twinkle {
      from {opacity:.4;transform:scale(.85)}
      to {opacity:.9;transform:scale(1.15)}
    }

    /* Inputs */
    .input-field {
      background: rgba(255,255,255,.15);
      backdrop-filter: blur(10px);
      border:1px solid rgba(255,255,255,.25);
      transition:.3s;
    }

    .input-field:focus {
      transform: translateY(-2px);
      box-shadow:0 8px 24px rgba(0,0,0,.35);
    }

    /* Swatches hover */
    .color-swatch {
      transition:.3s;
      border-radius:9999px;
    }
    .color-swatch:hover {
      transform:scale(1.15);
      box-shadow:0 0 20px rgba(210,179,134,.6);
    }


    .recommendation-card {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(16px);
    }

    .recommendation-card > div:nth-child(2) {
      background: linear-gradient(
        to bottom,
        transparent,
        rgba(255,255,255,0.4),
        transparent
      );
    }

    /* Button */
    .submit-btn {
      background:linear-gradient(135deg,#9e1814,#be6e3f);
      color:#fff;
      transition:.3s;
    }
    .submit-btn:hover {
      transform:translateY(-3px);
      box-shadow:0 12px 30px rgba(0,0,0,.5);
    }

  </style>
</head>

<body class="h-full bg-pattern">

<!-- Stars -->
<div id="sprinkle-rain"></div>

<!-- App wrapper (NO background here) -->
<div id="app-wrapper" class="relative min-h-screen z-20">

  <div class="py-8 px-5">
    <div class="max-w-6xl mx-auto">

      <!-- Header -->
      <header class="text-center mb-12">
        <h1 class="text-5xl font-bold text-black mb-3 font-main-title tracking-tight">
          Top Outfits Suggestions
        </h1>
        <p class="text-xl text-brown-100">
          Expert color recommendations based on event, season & location
        </p>
        <p class="text-sm mb-2 text-black-200">
          Rule-based inference system for optimal combinations
        </p>
      </header>

    <!-- SINGLE PANEL CONTAINER -->
    <div class="max-w-6xl mx-auto h-[90vh] bg-white/20 backdrop-blur-xl rounded-3xl flex flex-col md:flex-row overflow-hidden shadow-2xl">

      <!-- LEFT: FORM -->
      <section class="w-full md:w-[35%] px-8 flex flex-col justify-center">
        <div id="form-container" class="space-y-4 w-full max-w-xs mt-8 mb-8"></div>
      </section>

      <!-- DIVIDER -->
      <div class="hidden md:block absolute top-3 bottom-3 w-px bg-black/30"
     style="left:35%"></div>

      <!-- RIGHT: RESULTS -->
      <section class="w-full md:w-[65%] flex flex-col overflow-y-auto">
        <!-- TITLE -->
        <h2 class="text-3xl font-bold text-center mt-4 mb-2 font-card-title">
          Your Personalized Outfit
        </h2>

        <!-- RESULTS -->
        <div id="result-container"class="w-full flex flex-col
            px-6   <!-- horizontal padding left/right -->
            overflow-y-auto hidden opacity-0
            transition-opacity duration-500">
          <div id="color-swatches" class="grid grid-cols-2 gap-4 w-full"></div>
          <div id="combinations-list" class="w-full mt-6"></div>
        </div>
      </section>

</div>


</div>
<!-- DEV DEBUG PANEL (VISIBLE FOR NOW) -->
<div id="debug-panel"
     class="mt-4 p-4 rounded-xl bg-black/70 text-green-200 text-xs font-mono max-h-64 overflow-y-auto">
</div>


</div>


  </div>
</div>

    </div>
  </div>
</div>

  <!-- Scripts -->
<script>
/***********************
 * HELPER: LOAD HTML PARTS
 ***********************/
async function loadHTML(url, containerId){
  try {
    const res = await fetch(url);
    const html = await res.text();
    const container = document.getElementById(containerId);
    if(container){
      container.innerHTML = html;
      return container;
    }
  } catch(err){
    console.error(`Failed to load ${url}`, err);
  }
  return null;
}

/***********************
 * KNOWLEDGE BASE
 ***********************/
const KB = {
  tops: ["T-Shirt","Crop Top","Blouse","Shirt"],
  bottoms: ["Jeans","Palazzo Pants","Skirt","Shorts"],
  colors: [
    "Black","White","Pastel Pink","Lavender","Light Blue",
    "Navy Blue","Gray","Emerald Green","Deep Purple",
    "Ruby Red","Coral","Denim Blue","Blush Pink"
  ],
  themeColors:{
    cute: ["Pastel Pink","Lavender","Blush Pink"],
    formal: ["Black","White","Navy Blue"],
    sporty: ["Black","White","Coral"],
    academic: ["Navy Blue","Gray","White"],
    elegant: ["Emerald Green","Deep Purple","Ruby Red"],
    casual: ["Light Blue","White","Denim Blue"]
  },
  compatibleTops: {
    "Jeans": ["T-Shirt","Shirt","Blouse"],
    "Palazzo Pants": ["Blouse","Crop Top"],
    "Skirt": ["Blouse","Crop Top"],
    "Shorts": ["T-Shirt","Crop Top"]
  }
};

/***********************
 * GLOBAL STATE (for re-pick)
 ***********************/
let filteredState = {
  tops: [],
  colors: [],
  bottom: null
};

/***********************
 * UTILITIES
 ***********************/
const shuffle = arr => [...arr].sort(()=>Math.random()-0.5);

function getRandomSubset(tops, bottomArr, colors){
  return {
    tops: shuffle(tops).slice(0,2),
    bottoms: bottomArr,
    color: shuffle(colors).slice(0,4)
  };
}

function showNotification(msg){
  const n = document.createElement('div');
  n.textContent = msg;
  Object.assign(n.style,{
    position:"fixed",top:"20px",right:"20px",
    background:"#ef4444",color:"#fff",
    padding:"16px 24px",borderRadius:"12px",
    zIndex:1000
  });
  document.body.appendChild(n);
  setTimeout(()=>n.remove(),3000);
}

function getColorCode(name){
  const map = {
    Black:"#000", White:"#fff", Gray:"#808080",
    "Pastel Pink":"#ffd1dc", Lavender:"#e6e6fa",
    "Light Blue":"#add8e6", "Navy Blue":"#001f3f",
    "Emerald Green":"#50c878", "Deep Purple":"#673ab7",
    "Ruby Red":"#9b111e", Coral:"#ff7f50",
    "Denim Blue":"#1560bd", "Blush Pink":"#f9c0c0"
  };
  return map[name] || "#ccc";
}

/***********************
 * RULE ENGINE
 ***********************/
function applyRules(user){
  let tops = [...KB.tops];
  let colors = [...KB.colors];
  const selectedBottom = user.bottom;

  // WEATHER
  if(user.weather === "Hot"){
    colors = colors.filter(c=>!["Black","Gray"].includes(c));
  }
  if(user.weather === "Rainy"){
    colors = colors.filter(c=>!["White","Pastel Pink"].includes(c));
  }

  // LOCATION
  if(["indoor","office","classroom","hall"].includes(user.location_type)){
    tops = tops.filter(t=>!["T-Shirt","Crop Top"].includes(t));
  }

  // GENDER
  if(["male","boy"].includes(user.gender)){
    tops = tops.filter(t=>!["Crop Top","Blouse"].includes(t));
  }

  // THEME
  if(user.event_theme && KB.themeColors[user.event_theme]){
    colors = colors.filter(c=>KB.themeColors[user.event_theme].includes(c));
  }

  // BOTTOM COMPATIBILITY
  if(selectedBottom && KB.compatibleTops[selectedBottom]){
    tops = tops.filter(t=>KB.compatibleTops[selectedBottom].includes(t));
  }

  filteredState = { tops, colors, bottom: selectedBottom };

  renderDebugInfo(tops, selectedBottom, colors, user);

  return getRandomSubset(tops, [selectedBottom], colors);
}

/***********************
 * DEBUG PANEL
 ***********************/
function renderDebugInfo(tops,bottom,colors,user){
  const panel = document.getElementById('debug-panel');
  if(!panel) return;

  panel.innerHTML = `
    <div class="text-green-400 font-bold mb-2">[DEV MODE] Rule Evaluation</div>
    <div class="mb-2 text-yellow-300">
      Gender: ${user.gender}<br>
      Weather: ${user.weather}<br>
      Location: ${user.location_type || "—"}<br>
      Theme: ${user.event_theme || "—"}<br>
      Selected Bottom: ${bottom || "—"}
    </div>
    <div class="mb-2"><b>Compatible Tops</b><br>${tops.join("<br>") || "NONE"}</div>
    <div><b>Colors</b><br>${colors.join("<br>") || "NONE"}</div>
  `;

  panel.classList.remove('hidden');
}

/***********************
 * DISPLAY RESULTS
 ***********************/
function displayRuleResult(result){
  const swatches = document.getElementById('color-swatches');
  const combos = document.getElementById('combinations-list');
  const section = document.getElementById('result-container');
  if(!swatches || !combos || !section) return;

  // COLORS
  swatches.innerHTML = result.color.map(c=>`
    <div class="text-center">
      <div class="color-swatch mb-2 w-13 h-10 mx-auto" style="background:${getColorCode(c)}"></div>
      <p class="text-sm font-medium mb-6">${c}</p>
    </div>
  `).join("");

  // TOPS
 combos.innerHTML = `
  <div class="mb-6">
    <h4 class="text-center font-semibold mb-3">Top Wear</h4>
    <div class="grid grid-cols-2 gap-4">
      ${result.tops.map(i=>`
        <div class="outfit-card flex flex-col items-center text-center h-full w-full">
          <img src="/images/tops/${i.toLowerCase().replace(/\s/g,'_')}.jpg"
               class="w-full max-h-40 object-contain rounded-xl mb-2">
          <p class="text-sm font-medium mt-auto">${i}</p>
        </div>
      `).join("")}
    </div>
  </div>

  <div class="mb-6">
    <h4 class="text-center font-semibold mb-3">Your Bottom</h4>
    <div class="grid grid-cols-1 gap-4 justify-items-center">
      <div class="outfit-card flex flex-col items-center text-center h-full w-1/2">
        <img src="/images/bottoms/${result.bottoms[0].toLowerCase().replace(/\s/g,'_')}.jpg"
             class="w-full max-h-40 object-contain rounded-xl mb-2">
        <p class="text-sm font-medium mt-auto">${result.bottoms[0]}</p>
      </div>
    </div>
  </div>
`;

  section.classList.remove("hidden","opacity-0");
}

/***********************
 * FORM HANDLERS
 ***********************/
function handleFormSubmit(e){
  e.preventDefault();

  const user = {
    gender: document.getElementById('gender')?.value,
    weather: document.getElementById('weather')?.value,
    location_type: document.getElementById('location')?.value,
    event_theme: document.getElementById('event-theme')?.value,
    event_type: document.getElementById('event-type')?.value,
    bottom: document.getElementById('bottom')?.value
  };

  if(!user.gender || !user.weather || !user.event_type || !user.bottom){
    showNotification("Please fill Gender, Weather, Event Type and Bottom.");
    return;
  }

  displayRuleResult(applyRules(user));
}

function pickOtherCombination(){
  if(!filteredState.tops.length){
    showNotification("Submit the form first!");
    return;
  }
  displayRuleResult(
    getRandomSubset(
      filteredState.tops,
      [filteredState.bottom],
      filteredState.colors
    )
  );
}

/***********************
 * STAR RAIN EFFECT
 ***********************/
function initStarRain(){
  const container = document.getElementById('sprinkle-rain');
  if(!container) return;
  const colors = ['#FFFFFF','#d1c5b1','#d1b386','#be6e3f','#b9885c'];
  const shapes = ['✦','✧','★','✶','✴','✷'];

  function createStar(){
    const star = document.createElement('div');
    star.className = 'star';
    const size=Math.random()*14+10, left=Math.random()*window.innerWidth;
    const shape = shapes[Math.floor(Math.random()*shapes.length)];
    const color = colors[Math.floor(Math.random()*colors.length)];
    star.style.fontSize = size+'px';
    star.style.left = left+'px';
    star.style.top = '-30px';
    star.style.color = color;
    star.innerHTML = shape;
    container.appendChild(star);
    const fallDuration = Math.random()*5000+8000;
    const startTime = Date.now();
    function fall(){ 
      const progress=(Date.now()-startTime)/fallDuration; 
      star.style.top = (-30 + progress*(window.innerHeight+60))+'px';
      if(progress<1) requestAnimationFrame(fall);
      else star.remove();
    }
    requestAnimationFrame(fall);
  }

  for(let i=0;i<20;i++) setTimeout(createStar,i*100);
  setInterval(()=>{for(let i=0;i<3;i++) createStar();},400);
}

/***********************
 * MAIN INIT
 ***********************/
document.addEventListener('DOMContentLoaded', async ()=>{
  await loadHTML('./parts/formtop.html','form-container');
  await loadHTML('./parts/result.html','result-container');

  document.querySelector('#outfit-form')?.addEventListener('submit',handleFormSubmit);
  document.querySelector('#pick-other-btn')?.addEventListener('click',pickOtherCombination);

  initStarRain();
});
</script>
<script src="/assets/js/sidebar.js"></script>


</body>
